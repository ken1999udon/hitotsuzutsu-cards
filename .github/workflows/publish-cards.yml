name: Publish study cards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check the chapter exporter
        run: python3 -m unittest discover -s tests
      - name: Generate all chapters
        run: python3 tools/export_catalog.py --output "$RUNNER_TEMP/catalog.json"
      - name: Publish the generated JSON
        shell: bash
        run: |
          source_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin published; then
            git fetch origin published
            git switch -c published FETCH_HEAD
          else
            git switch --orphan published
          fi
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish cards from $source_sha"
            git push origin HEAD:published
          fi
